<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask To-Do List</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 600px;">
        <h2 class="text-center mb-4">My To-Do List</h2>

        <!-- Task Input Form -->
        <form action="/" method="POST" class="input-group mb-4">
            <input type="text" name="content" class="form-control" placeholder="Add a new task..." required>
            <button class="btn btn-primary" type="submit">Add Task</button>
        </form>

        <!-- Tasks Display Area -->
        <ul class="list-group">
            {% for task in tasks %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span>{{ task.title }}</span>
                    <a href="/delete/{{ task.id }}" class="btn btn-danger btn-sm">Delete</a>
                </li>
            {% else %}
                <li class="list-group-item text-center text-muted">No tasks yet. Add one above!</li>
            {% endfor %}
        </ul>
    </div>

</body>
</html>
